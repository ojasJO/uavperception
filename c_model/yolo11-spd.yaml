# AeroTrack-Net  --  YOLOv11 backbone with SPD-Conv downsampling + 9-channel input
# ---------------------------------------------------------------------------
#  * ch: 9        -> temporal 3-frame stack (t-1, t, t+1) x RGB, from AeroTrackDataset
#  * Backbone     -> every stride-2 `Conv` replaced by `SPDConv` (lossless /2 downsample)
#  * Neck + Head  -> left INTACT (standard YOLOv11 PAN-FPN + Detect)
#  Layer indices are preserved (SPDConv is a 1-for-1 swap of Conv), so the head's
#  backbone skip-connections ([4], [6], [10]) stay valid.

nc: 2                 # 0 = uav_drone, 1 = bird_hard_negative (unified Phase-B scheme)
ch: 9                 # 9-channel spatio-temporal input

# n-size compute budget (small; keeps the CPU dry-run fast). No `scales` key ->
# these multipliers apply directly.
depth_multiple: 0.50
width_multiple: 0.25
max_channels: 1024

# ------------------------------- Backbone ---------------------------------- #
# [from, repeats, module, args]
backbone:
  - [-1, 1, SPDConv, [64, 3]]            # 0-P1/2   (9  -> 64,  640->320)  [was Conv s2]
  - [-1, 1, SPDConv, [128, 3]]           # 1-P2/4   (      ->128, 320->160)  [was Conv s2]
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2
  - [-1, 1, SPDConv, [256, 3]]           # 3-P3/8   (160->80)               [was Conv s2]
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, SPDConv, [512, 3]]           # 5-P4/16  (80->40)                [was Conv s2]
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, SPDConv, [1024, 3]]          # 7-P5/32  (40->20)                [was Conv s2]
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]             # 9
  - [-1, 2, C2PSA, [1024]]               # 10

# --------------------------- Neck + Head (intact) -------------------------- #
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]            # cat backbone P4
  - [-1, 2, C3k2, [512, False]]          # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]            # cat backbone P3
  - [-1, 2, C3k2, [256, False]]          # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]           # (head downsample stays a standard Conv)
  - [[-1, 13], 1, Concat, [1]]           # cat head P4
  - [-1, 2, C3k2, [512, False]]          # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]           # (head downsample stays a standard Conv)
  - [[-1, 10], 1, Concat, [1]]           # cat head P5
  - [-1, 2, C3k2, [1024, True]]          # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]      # Detect(P3, P4, P5)
