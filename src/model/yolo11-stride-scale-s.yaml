# AeroTrack v3 capacity baseline: YOLO11s scale (depth 0.50, width 0.50) of the stride layout, 9-channel input
# ---------------------------------------------------------------------------------------------------------
#  NOTE: do not name this file yolo11s-*.yaml -- Ultralytics yaml_model_load maps yolo11s-x.yaml to the "unified" yolo11-x.yaml
#  (regex (d+)([nslmx]) strips the scale letter) and would silently load the n-width stride layout instead.
#  Identical to yolo11-stride.yaml except width_multiple 0.25 -> 0.50 (the official YOLO11s scale). COCO weights:
#  src/model/yolo11s.pt (Ultralytics assets v8.3.0, AGPL-3.0, sha256 85a76fe86dd8afe3...). Initialised like every
#  configuration of the series: COCO transfer by name and shape, COCO stem on the centre frame, zeros on the side
#  frames (experiments/aerotrack_v2/scripts/p2fp.py::apply_fp_init_from). Question it answers: is ~3x more capacity
#  worth more than the temporal cue at a deployable cost?

nc: 2                 # 0 = uav_drone, 1 = bird_hard_negative
ch: 9                 # 9-channel input (the run's temporal window)

depth_multiple: 0.50
width_multiple: 0.50
max_channels: 1024

# ------------------------------- Backbone ---------------------------------- #
# [from, repeats, module, args]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2    <- stride-2 (was SPDConv)
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4    <- stride-2 (was SPDConv)
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8    <- stride-2 (was SPDConv)
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5-P4/16   <- stride-2 (was SPDConv)
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7-P5/32   <- stride-2 (was SPDConv)
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]             # 9
  - [-1, 2, C2PSA, [1024]]               # 10

# --------------------------- Neck + Head (intact) -------------------------- #
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]            # cat backbone P4
  - [-1, 2, C3k2, [512, False]]          # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]            # cat backbone P3
  - [-1, 2, C3k2, [256, False]]          # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]           # cat head P4
  - [-1, 2, C3k2, [512, False]]          # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]           # cat head P5
  - [-1, 2, C3k2, [1024, True]]          # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]      # Detect(P3, P4, P5)
