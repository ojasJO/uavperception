# AeroTrack v3 candidate: stock YOLO11n (stride layout, 9-channel input) + an APPENDED P2/4 detection scale
# ---------------------------------------------------------------------------------------------------------
# Function-preserving by construction: layers 0-22 are exactly stock yolo11n (same indices, same names, so every COCO
# tensor transfers by name and shape); the P2 branch is appended after them (23-25) and Detect takes (P3, P4, P5, P2).
# P2 is the LAST Detect input on purpose: Ultralytics sizes the Detect branch widths from the FIRST input and its
# TaskAlignedAssigner treats stride[0] as the smallest stride (boxes < stride[0] are widened to stride[1] for candidate
# selection). With P3 first, branches 0-2 and the assignment rule are exactly stock's; the P2 scale is the only change.
# experiments/aerotrack_v2/scripts/p2fp.py::init_p2fp maps the stock Detect branches onto the P3-P5 scales and sets the
# P2 class bias to -20, so at initialisation the model's P3-P5 outputs equal stock YOLO11n and its P2 anchors score ~2e-9
# (below the 0.001 evaluation threshold) -- verified numerically at runtime before training.
# Why: micro targets are often found but mislocalised (IoU 0.25-0.5; generalization series D5) -- a stride-4 scale gives
# 4x finer anchor spacing. Compare: src/model/yolo11-spd-p2.yaml re-routes the P3 path (not function-preserving).

nc: 2                 # 0 = uav_drone, 1 = bird_hard_negative
ch: 9                 # 9-channel temporal input

depth_multiple: 0.50
width_multiple: 0.25
max_channels: 1024

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2       <- backbone P2/4 feature (used by the appended branch)
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5-P4/16
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]             # 9
  - [-1, 2, C2PSA, [1024]]               # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12
  - [-1, 2, C3k2, [512, False]]                   # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15
  - [-1, 2, C3k2, [256, False]]                   # 16 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 13], 1, Concat, [1]]                    # 18
  - [-1, 2, C3k2, [512, False]]                   # 19 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                    # 20
  - [[-1, 10], 1, Concat, [1]]                    # 21
  - [-1, 2, C3k2, [1024, True]]                   # 22 (P5/32)
  # ---- appended P2/4 branch (new) ----
  - [16, 1, nn.Upsample, [None, 2, "nearest"]]    # 23  P3 -> stride 4
  - [[-1, 2], 1, Concat, [1]]                     # 24  cat backbone P2/4
  - [-1, 2, C3k2, [128, False]]                   # 25 (P2/4)
  - [[16, 19, 22, 25], 1, Detect, [nc]]           # 26  Detect(P3, P4, P5, P2) -- P2 LAST, see header
